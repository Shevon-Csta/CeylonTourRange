<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Ceylon Tour Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div style="display:grid; grid-template-columns: 1fr 1fr; min-height:100vh;">
  <!-- Visual panel -->
  <div style="position:relative; overflow:hidden;" class="hide-mobile">
    <img src="https://images.unsplash.com/photo-1546708973-b339540b5162?auto=format&fit=crop&w=1200&q=80" alt="Sigiriya"
         style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;"
         onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1200&q=80'" />
    <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(4,33,31,0.3), rgba(4,33,31,0.8)); display:flex; flex-direction:column; justify-content:flex-end; padding:56px; color:#fff;">
      <h2 style="color:#fff;">The whole island,<br/>one login.</h2>
      <p class="lede" style="color:rgba(255,255,255,0.85);">Your bookings, itineraries, and saved places — synced everywhere.</p>
    </div>
  </div>

  <!-- Form panel -->
  <div style="display:flex; align-items:center; justify-content:center; padding: 48px 24px;">
    <div style="width:100%; max-width:420px;" class="reveal is-visible">
      <a class="brand mb-3" href="home.html" style="display:inline-flex;"><span class="brand-mark">C</span> Ceylon Tour Range</a>
      <h2 class="mt-3">Welcome back</h2>
      <p class="muted mb-3">Log in to manage your trips.</p>

      <div class="tabs">
        <button class="tab active">Log in</button>
        <button class="tab">Sign up</button>
      </div>

      <button class="btn btn-ghost btn-block mb-2">🌐 &nbsp;Continue with Google</button>
      <button class="btn btn-ghost btn-block">📘 &nbsp;Continue with Facebook</button>

      <div class="flex mt-3 mb-2" style="gap:16px;">
        <div class="divider" style="flex:1; margin:0;"></div>
        <span class="muted small">or with email</span>
        <div class="divider" style="flex:1; margin:0;"></div>
      </div>

      <div class="field">
        <label>Email address</label>
        <input class="input" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" placeholder="••••••••" />
      </div>
      <div class="flex-between mb-3">
        <label class="small muted"><input type="checkbox" checked /> Remember me</label>
        <a class="small" style="color:var(--teal-700); font-weight:700;" href="#">Forgot password?</a>
      </div>

      <a class="btn btn-primary btn-block btn-lg" href="dashboard.html">Log in</a>
      <p class="small muted text-center mt-3">New here? <a style="color:var(--teal-700); font-weight:700;" href="#">Create an account</a></p>
    </div>
  </div>
</div>

<script src="assets/mock.js"></script>
</body>
</html>
